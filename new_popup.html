<!DOCTYPE html>
<html>

<head>
    <title>Hand Gesture Scroll</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin-right: 10px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        h2 {
            margin-top: 0;
        }

        .settings-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2196F3;
            text-decoration: none;
        }

        .settings-link:hover {
            text-decoration: underline;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .active {
            background-color: #dff0d8;
            color: #3c763d;
        }

        .inactive {
            background-color: #f2dede;
            color: #a94442;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .feedback-btn {
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 4px;
            color: #3c4043;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .feedback-btn:hover {
            background-color: #f1f3f4;
            border-color: #d2d5d9;
        }

        .emoji {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h2>Hand Gesture Scroll</h2>
    <div class="toggle-container">
        <label class="toggle">
            <input type="checkbox" id="gestureToggle" checked>
            <span class="slider"></span>
        </label>
        <span>Enable Hand Gesture Control</span>
    </div>
    <div id="status" class="status active">Status: Ready</div>

    <div class="btn-container">
        <button id="toggleFeedback" class="feedback-btn">
            <span class="emoji">👁️</span> Show Visual Feedback
        </button>
    </div>

    <a href="#" id="openSettings" class="settings-link">Advanced Settings</a>
    <script src="popup.js"></script>
</body>

</html>
